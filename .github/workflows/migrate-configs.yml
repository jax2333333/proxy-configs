name: Migrate proxy configs

on:
  push:
    paths:
      - '.github/workflows/migrate-configs.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pinned Gist revisions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shadowrocket clash-verge openclash

          curl -fL --retry 3 \
            'https://gist.githubusercontent.com/jax2333333/3745fc1bc0d793346c2caae32fdc3d35/raw/d342a83a92491b81692521c5b3947fd50fc279bb/Jax-shadowrocket-v6.conf' \
            -o shadowrocket/Jax-shadowrocket-v6.conf

          curl -fL --retry 3 \
            'https://gist.githubusercontent.com/jax2333333/50ddce2fe0f2e587a80b94f6c9ed49eb/raw/271a11a601182b77335b6aeadfa69ba8a3dfd6d4/clash-verge-by-jax.yaml' \
            -o clash-verge/clash-verge-by-jax.yaml

          curl -fL --retry 3 \
            'https://gist.githubusercontent.com/jax2333333/e578e785ab374a2ae4d4bfd4d3c91593/raw/4c25786d12ffb8c0ea08258117e7d5073ae4949b/openclash_by_jax_v5.yaml' \
            -o openclash/openclash_by_jax_v5.yaml

      - name: Verify exact uploaded versions
        shell: bash
        run: |
          set -euo pipefail
          echo '20c01f8efd064f951506a8d7e01a094981efdd4d9eed6b13fafaa604776aa2f7  shadowrocket/Jax-shadowrocket-v6.conf' | sha256sum -c -
          echo '447339c2f9a230e006148056565fd909e91949cbba411bbed44e12de0f7a49b5  clash-verge/clash-verge-by-jax.yaml' | sha256sum -c -
          echo '4c9ea646dfae8af674f36aee547a75d3c7f4c47a96794e11614ba9af72f4148e  openclash/openclash_by_jax_v5.yaml' | sha256sum -c -

      - name: Point Shadowrocket updater to new repository
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('shadowrocket/Jax-shadowrocket-v6.conf')
          s = p.read_text(encoding='utf-8')
          old = 'update-url = https://gist.githubusercontent.com/jax2333333/3745fc1bc0d793346c2caae32fdc3d35/raw/Jax-shadowrocket-v6.conf'
          new = 'update-url = https://raw.githubusercontent.com/jax2333333/proxy-configs/main/shadowrocket/Jax-shadowrocket-v6.conf'
          if old not in s:
              raise SystemExit('Expected Shadowrocket update-url not found')
          s = s.replace(old, new)
          s = s.replace('# Gist 自动更新\n# 使用不绑定 revision 的 Raw 地址', '# GitHub 自动更新\n# 使用 main 分支 Raw 地址')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Safety check
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Clash Verge / Mihomo - JAX V2.2 GitHub Template' clash-verge/clash-verge-by-jax.yaml
          grep -F 'url: "https://example.com/airport.yaml"' openclash/openclash_by_jax_v5.yaml
          ! grep -E 'no-mad-sub|/link/[A-Za-z0-9_-]{12,}' clash-verge/clash-verge-by-jax.yaml openclash/openclash_by_jax_v5.yaml

      - name: Commit migrated configs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/migrate-configs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: migrate Shadowrocket Clash Verge and OpenClash configs'
          git push
