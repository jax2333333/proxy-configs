# openclash_by_jax_v6.0
# 基于 V5.6 重构
# 目标：双机场 A/B 隔离 / 八地区 Smart 自动选择 / 人工选择 / AI 香港排除
#
# V6.0 更新：
# 1. Provider 重构为主力 Airport-A 与辅助 Airport-B，节点分别增加 A| / B| 前缀
# 2. 香港、日本、新加坡、美国、台湾、韩国、英国、德国均建立 A/B 独立 Smart 与手动节点组
# 3. 新增 ♻️AI智能选择，AI 仅使用非香港地区节点
# 4. 仅保留 Smart 与手动选择，不再配置 fallback 类型
# 5. 统一应用策略入口，同时保留 DNS、Fake-IP 和 Rule Provider 设计
#
# 说明：
# OpenClash 的运行模式、DNS 劫持、中国 IP 绕过等由 LuCI/UCI 控制，
# 需按配套设置启用。

proxy-providers:
  Airport-A:
    url: "https://example.com/airport-a.yaml"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: "A|"

  Airport-B:
    url: "https://example.com/airport-b.yaml"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: "B|"


# ============================================================
# 节点信息
# ============================================================

proxies:
- {name: 🚀 直连, type: direct}


# ============================================================
# 全局配置
# ============================================================

mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
mode: rule
find-process-mode: 'off'
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"


# ============================================================
# 嗅探
# ============================================================

sniffer:
  enable: true

  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

    TLS:
      ports: [443, 8443]

    QUIC:
      ports: [443, 8443]

  skip-domain:
  - "Mijia Cloud"
  - "+.push.apple.com"


# ============================================================
# DNS 模块
# TUN / 透明代理模式由 OpenClash LuCI 控制
# ============================================================

dns:
  enable: true
  cache-algorithm: arc
  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  fake-ip-filter-mode: blacklist

  fake-ip-filter:
  - +.lan
  - +.local
  - dns.alidns.com
  - doh.pub
  - +.market.xiaomi.com
  - rule-set:private_domain
  - rule-set:cn_domain

  # ----------------------------------------------------------
  # 代理节点域名
  # 使用国内 DoH，避免代理尚未建立时出现 DNS 死循环
  # ----------------------------------------------------------

  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query

  # ----------------------------------------------------------
  # 仅用于解析 DoH 服务器自身域名
  # 保留纯 IP 国内 DNS
  # ----------------------------------------------------------

  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29

  # ----------------------------------------------------------
  # 默认境外域名
  # 使用海外 DoH，并显式遵守路由规则
  # ----------------------------------------------------------

  nameserver:
  - https://1.1.1.1/dns-query#RULES
  - https://8.8.8.8/dns-query#RULES

  prefer-h3: false
  respect-rules: true

  # ----------------------------------------------------------
  # DNS / IP 泄漏检测域名
  # 上游 cn.mrs / OpenClash oc-cn-domain 可能误归类这些域名
  # 即使仍因 Fake-IP Filter 返回真实结果，也必须使用海外 DoH
  # ----------------------------------------------------------

  nameserver-policy:
    "+.browserleaks.com":
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    "+.browserleaks.net":
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    "whoami.akamai.net":
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    "whatismyip.akamai.com":
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    "+.surfshark.com":
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES

    # 中国域名使用国内 DoH
    # 保持国内 CDN 命中和低延迟
    rule-set:cn_domain:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # ----------------------------------------------------------
  # DIRECT 出口域名使用国内 DoH
  # cn_domain 继续优先遵守上面的 policy
  # ----------------------------------------------------------

  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query

  direct-nameserver-follow-policy: true


