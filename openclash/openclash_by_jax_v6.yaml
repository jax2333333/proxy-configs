# ============================================================
# 规则匹配
# ============================================================

rules:

# ------------------------------------------------------------
# ZeroTier
# 主控制 / 打洞端口直连，仅 UDP 9993
# ------------------------------------------------------------

- AND,((NETWORK,UDP),(DST-PORT,9993)),🚀 直连


# ------------------------------------------------------------
# 本地 / 私有地址
# ------------------------------------------------------------

- RULE-SET,private_ip,🚀 直连,no-resolve
- RULE-SET,private_domain,🚀 直连


# ------------------------------------------------------------
# 广告
# ------------------------------------------------------------

- RULE-SET,ads_domain,🛑 全局拦截


# ------------------------------------------------------------
# AI
# ------------------------------------------------------------

- RULE-SET,ai,🤖 AI

# ------------------------------------------------------------
# Steam
# ------------------------------------------------------------

- RULE-SET,steam_cn,🎮 Steam
- RULE-SET,steam_domain,🎮 Steam


# ------------------------------------------------------------
# GitHub / YouTube
# ------------------------------------------------------------

- RULE-SET,github_domain,🐙 GitHub
- RULE-SET,youtube_domain,📺 YouTube


# ------------------------------------------------------------
# Microsoft / OneDrive
# ------------------------------------------------------------

- RULE-SET,onedrive_domain,☁️ OneDrive
- RULE-SET,microsoft_domain,💻 Microsoft


# ============================================================
# Apple
# ============================================================

# Apple Push Notification Service
# iMessage / FaceTime / 系统推送相关
# 优先级高于普通 Apple 规则
- DOMAIN-SUFFIX,push.apple.com,🚀 直连

# Apple Intelligence / Private Cloud Compute / Apple Relay
#
# 即使当前未启用 Apple Intelligence 也保留规则，
# 防止 apple-relay.cloudflare.com 等域名掉入 MATCH。
#
# 不创建额外 Apple AI 分组，
# 直接交由现有 🍎 Apple 处理。
- RULE-SET,apple_intelligence,🍎 Apple

# Apple / iCloud / App Store / Music 等常规服务
- RULE-SET,apple_domain,🍎 Apple

# Apple 官方 IPv4 网段
# 补齐无法恢复域名的纯 IP / QUIC 流量，避免掉入 MATCH
- IP-CIDR,17.0.0.0/8,🍎 Apple,no-resolve


# ------------------------------------------------------------
# TikTok / Telegram / Netflix
# ------------------------------------------------------------

- RULE-SET,tiktok_domain,🎵 TikTok

- RULE-SET,telegram_domain,✈️ Telegram

- RULE-SET,netflix_domain,🎬 Netflix
- RULE-SET,netflix_ip,🎬 Netflix,no-resolve

- RULE-SET,telegram_ip,✈️ Telegram,no-resolve


# ------------------------------------------------------------
# Google
# ------------------------------------------------------------

- RULE-SET,google_domain,🔮 节点选择
- RULE-SET,google_ip,🔮 节点选择,no-resolve


# ------------------------------------------------------------
# DNS / IP 泄漏检测
# 修复 meta-rules-dat cn.mrs / OpenClash oc-cn-domain 误归类
# ------------------------------------------------------------

- DOMAIN-SUFFIX,browserleaks.com,🔮 节点选择
- DOMAIN-SUFFIX,browserleaks.net,🔮 节点选择
- DOMAIN,whoami.akamai.net,🔮 节点选择
- DOMAIN,whatismyip.akamai.com,🔮 节点选择
- DOMAIN-SUFFIX,surfshark.com,🔮 节点选择


# ------------------------------------------------------------
# 中国大陆
# ------------------------------------------------------------

- RULE-SET,cn_domain,🚀 直连
- RULE-SET,cn_ip,🚀 直连,no-resolve


# ------------------------------------------------------------
# 最终兜底
# ------------------------------------------------------------

- MATCH,🐟 漏网之鱼
