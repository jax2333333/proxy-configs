# ============================================================
# 节点策略组
# ============================================================

# ------------------------------------------------------------
# Smart / 自动选择
# ------------------------------------------------------------

- {name: ♻️ 智能选择, type: smart, use: [Airport1], url: https://www.gstatic.com/generate_204, interval: 300, tolerance: 100, uselightgbm: false, collectdata: false, exclude-type: direct, exclude-filter: '免费|0\.01'}

- {name: ♻️ 备用智能选择, type: smart, use: [Airport2, Airport3], url: https://www.gstatic.com/generate_204, interval: 300, tolerance: 100, uselightgbm: false, collectdata: false, exclude-type: direct}

- {name: 🌐 全部节点, type: select, include-all: true, exclude-type: direct}

- {name: ♻️ 香港智能, type: smart, uselightgbm: false, collectdata: false, use: [Airport1], interval: 300, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$", exclude-type: direct, url: https://www.gstatic.com/generate_204, tolerance: 100}

- {name: ♻️ 日本智能, type: smart, uselightgbm: false, collectdata: false, use: [Airport1], interval: 300, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$", exclude-type: direct, url: https://www.gstatic.com/generate_204, tolerance: 100, exclude-filter: '免费|0\.01'}

- {name: ♻️ 狮城智能, type: smart, uselightgbm: false, collectdata: false, use: [Airport1], interval: 300, filter: "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(港|台|日|韩|美)).)*$", exclude-type: direct, url: https://www.gstatic.com/generate_204, tolerance: 100}

- {name: ♻️ 美国智能, type: smart, uselightgbm: false, collectdata: false, use: [Airport1], interval: 300, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$", exclude-type: direct, url: https://www.gstatic.com/generate_204, tolerance: 100}


# ------------------------------------------------------------
# 地区手动选择
# ------------------------------------------------------------

- {name: 🇭🇰 香港节点, type: select, use: [Airport1], filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$", exclude-type: direct}

- {name: 🇯🇵 日本节点, type: select, use: [Airport1], filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$", exclude-type: direct}

- {name: 🇸🇬 狮城节点, type: select, use: [Airport1], filter: "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|美)).)*$", exclude-type: direct}

- {name: 🇺🇲 美国节点, type: select, use: [Airport1], filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$", exclude-type: direct}


# ------------------------------------------------------------
# 故障转移
# ------------------------------------------------------------

- {name: 🔯 香港故转, type: fallback, use: [Airport1], interval: 300, filter: "(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|深|美)).)*$", exclude-type: direct, url: https://www.gstatic.com/generate_204}

- {name: 🔯 日本故转, type: fallback, use: [Airport1], interval: 300, filter: "(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美)).)*$", exclude-type: direct, url: https://www.gstatic.com/generate_204}

- {name: 🔯 狮城故转, type: fallback, use: [Airport1], interval: 300, filter: "(?=.*(新加坡|坡|狮城|SG|Singapore))^((?!(台|日|韩|美)).)*$", exclude-type: direct, url: https://www.gstatic.com/generate_204}

- {name: 🔯 美国故转, type: fallback, use: [Airport1], interval: 300, filter: "(?=.*(美|US|(?i)States|America))^((?!(港|台|日|韩|新)).)*$", exclude-type: direct, url: https://www.gstatic.com/generate_204}


# ============================================================
# 规则集定义
# ============================================================

rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}


rule-providers:

  # ----------------------------------------------------------
  # 基础规则
  # ----------------------------------------------------------

  private_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/private.mrs"

  ai:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ai-!cn.mrs"

  youtube_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/youtube.mrs"

  google_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/google.mrs"

  github_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/github.mrs"

  telegram_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/telegram.mrs"

  netflix_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/netflix.mrs"

  onedrive_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/onedrive.mrs"

  microsoft_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/microsoft.mrs"


  # ----------------------------------------------------------
  # Apple
  # ----------------------------------------------------------

  # Apple 常规服务
  apple_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple.mrs"

  # Apple Intelligence / Private Cloud Compute / Apple Relay
  #
  # 例如：
  # apple-relay.apple.com
  # apple-relay.cloudflare.com
  # apple-relay.fastly-edge.com
  #
  # 不单独创建策略组，统一交给 🍎 Apple
  apple_intelligence:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/apple-intelligence.mrs"

  tiktok_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/tiktok.mrs"

  ads_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"

  steam_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam.mrs"


  # ----------------------------------------------------------
  # Steam 国内下载 / CDN
  # 使用 MetaCubeX steam@cn.mrs，数据已合并 ios_rule_script/SteamCN
  # ----------------------------------------------------------

  steam_cn:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam@cn.mrs"


  # ----------------------------------------------------------
  # 国内规则
  # ----------------------------------------------------------

  cn_domain:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"


  # ----------------------------------------------------------
  # IP 规则
  # ----------------------------------------------------------

  private_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/private.mrs"

  cn_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"

  google_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/google.mrs"

  telegram_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/telegram.mrs"

  netflix_ip:
    <<: *ip
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/netflix.mrs"


# ============================================================
# 规则匹配
# ============================================================

rules:

# ------------------------------------------------------------
# ZeroTier
# 主控制 / 打洞端口直连，仅 UDP 9993
# ------------------------------------------------------------

- AND,((NETWORK,UDP),(DST-PORT,9993)),🚀 直连


# ------------------------------------------------------------
# 本地 / 私有地址
# ------------------------------------------------------------

- RULE-SET,private_ip,🚀 直连,no-resolve
- RULE-SET,private_domain,🚀 直连


# ------------------------------------------------------------
# 广告
# ------------------------------------------------------------

- RULE-SET,ads_domain,🛑 全局拦截


# ------------------------------------------------------------
# AI
# ------------------------------------------------------------

- RULE-SET,ai,🤖 AI

# ------------------------------------------------------------
# Steam
# ------------------------------------------------------------

- RULE-SET,steam_cn,📥 Steam 下载
- RULE-SET,steam_domain,🎮 Steam 商店


# ------------------------------------------------------------
# GitHub / YouTube
# ------------------------------------------------------------

- RULE-SET,github_domain,🐙 GitHub
- RULE-SET,youtube_domain,📺 YouTuBe


# ------------------------------------------------------------
# Microsoft / OneDrive
# ------------------------------------------------------------

- RULE-SET,onedrive_domain,☁️ OneDriver
- RULE-SET,microsoft_domain,💻 Microsoft


# ============================================================
# Apple
# ============================================================

# Apple Push Notification Service
# iMessage / FaceTime / 系统推送相关
# 优先级高于普通 Apple 规则
- DOMAIN-SUFFIX,push.apple.com,🚀 直连

# Apple Intelligence / Private Cloud Compute / Apple Relay
#
# 即使当前未启用 Apple Intelligence 也保留规则，
# 防止 apple-relay.cloudflare.com 等域名掉入 MATCH。
#
# 不创建额外 Apple AI 分组，
# 直接交由现有 🍎 Apple 处理。
- RULE-SET,apple_intelligence,🍎 Apple

# Apple / iCloud / App Store / Music 等常规服务
- RULE-SET,apple_domain,🍎 Apple

# Apple 官方 IPv4 网段
# 补齐无法恢复域名的纯 IP / QUIC 流量，避免掉入 MATCH
- IP-CIDR,17.0.0.0/8,🍎 Apple,no-resolve


