# openclash_by_jax_v5.6
# 基于 V5.5 修改
# 目标：防 DNS 泄漏 / 国内低延迟直连 / 国外高性能 / Smart 内核 / 节点过滤优化
#
# V5.6 更新：
# 1. DNS / IP 泄漏检测域名强制使用海外 DoH，规避 cn.mrs / OpenClash oc-cn-domain 误分类
# 2. browserleaks / Akamai 回显 / Surfshark 检测域名在 cn_domain 前强制走代理
# 3. Apple 17.0.0.0/8 补充交给 🍎 Apple，避免纯 IP / QUIC 流量掉入漏网之鱼
# 4. Smart 分组过滤保持原设计，不做统一化
#
# V5.5 更新：
# 1. Steam 国内下载规则由 ios_rule_script classical YAML 改为 MetaCubeX steam@cn.mrs
# 2. ZeroTier 9993 直连规则收窄为仅 UDP，减少无关 TCP 9993 流量被放行
#
# V5.4 更新：
# 1. Airport1 仅加入原有智能/地区/故障转移分组
# 2. Airport2 / Airport3 不加入原有分组，仅保留在“全部节点”和“备用智能选择”
# 3. 新增“♻️ 备用智能选择”，仅使用 Airport2 / Airport3
# 4. “🔮 节点选择”新增“♻️ 备用智能选择”选项，其它功能策略组不新增该选项
#
# V5.3 更新：
# 1. proxy-providers 增加 Airport3 占位模板
# 2. Airport3 节点统一添加“网上搜刮|”前缀
# 3. 三个真实订阅 URL 继续仅由本地 local-airport.txt 覆写，GitHub 不保存真实地址
#
# V5.2 更新：
# 1. proxy-providers 增加 Airport2 占位模板
# 2. Airport1 / Airport2 分别添加 A1｜ / A2｜ 节点名前缀
# 3. 两个真实订阅 URL 继续仅由本地 local-airport.txt 覆写，GitHub 不保存真实地址
#
# V5.1 更新：
# 1. Apple 策略默认改为直连
# 2. 新增 Apple Intelligence / Apple Relay 规则集
# 3. Apple Intelligence 不单独建立策略组，统一交由 🍎 Apple
# 4. Apple Push / APNs (*.push.apple.com) 强制直连
# 5. 修复 apple-relay.cloudflare.com 掉入 MATCH / 漏网之鱼的问题
#
# 说明：
# OpenClash 的运行模式、DNS 劫持、中国 IP 绕过等由 LuCI/UCI 控制，
# 需按配套设置启用。

proxy-providers:
  Airport1:
    url: "https://example.com/airport1.yaml"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: "A1｜"

  Airport2:
    url: "https://example.com/airport2.yaml"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: "A2｜"

  Airport3:
    url: "https://example.com/airport3.yaml"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: "网上搜刮|"


# ============================================================
# 节点信息
# ============================================================

proxies:
- {name: 🚀 直连, type: direct}


# ============================================================
# 全局配置
# ============================================================

mixed-port: 7890
allow-lan: true
bind-address: "*"
ipv6: false
mode: rule
find-process-mode: 'off'
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"


# ============================================================
# 嗅探
# ============================================================

sniffer:
  enable: true

  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true

    TLS:
      ports: [443, 8443]

    QUIC:
      ports: [443, 8443]

  skip-domain:
  - "Mijia Cloud"
  - "+.push.apple.com"


# ============================================================
# DNS 模块
# TUN / 透明代理模式由 OpenClash LuCI 控制
# ============================================================

dns:
  enable: true
  cache-algorithm: arc
  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  fake-ip-filter-mode: blacklist

  fake-ip-filter:
  - +.lan
  - +.local
  - dns.alidns.com
  - doh.pub
  - +.market.xiaomi.com
  - rule-set:private_domain
  - rule-set:cn_domain

  # ----------------------------------------------------------
  # 代理节点域名
  # 使用国内 DoH，避免代理尚未建立时出现 DNS 死循环
  # ----------------------------------------------------------

  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query

  # ----------------------------------------------------------
  # 仅用于解析 DoH 服务器自身域名
  # 保留纯 IP 国内 DNS
  # ----------------------------------------------------------

  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29

  # ----------------------------------------------------------
  # 默认境外域名
  # 使用海外 DoH，并显式遵守路由规则
  # ----------------------------------------------------------

  nameserver:
  - https://1.1.1.1/dns-query#RULES
  - https://8.8.8.8/dns-query#RULES

  prefer-h3: false
  respect-rules: true

  # ----------------------------------------------------------
  # DNS / IP 泄漏检测域名
  # 上游 cn.mrs / OpenClash oc-cn-domain 可能误归类这些域名
  # 即使仍因 Fake-IP Filter 返回真实结果，也必须使用海外 DoH
  # ----------------------------------------------------------

  nameserver-policy:
    "+.browserleaks.com":
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    "+.browserleaks.net":
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    "whoami.akamai.net":
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    "whatismyip.akamai.com":
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    "+.surfshark.com":
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES

    # 中国域名使用国内 DoH
    # 保持国内 CDN 命中和低延迟
    rule-set:cn_domain:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # ----------------------------------------------------------
  # DIRECT 出口域名使用国内 DoH
  # cn_domain 继续优先遵守上面的 policy
  # ----------------------------------------------------------

  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query

  direct-nameserver-follow-policy: true


