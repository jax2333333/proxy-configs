# OpenClash by JAX 单机场版
# Based on openclash_by_jax_双机场.yaml
# Provider URLs intentionally remain placeholders.

proxy-providers:
  Airport-A:
    url: XXXXXXXXXXX
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: A|

proxies:
- name: 🚀 直连
  type: direct

mixed-port: 7890
allow-lan: true
bind-address: '*'
ipv6: false
mode: rule
find-process-mode: 'off'
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

external-controller: 0.0.0.0:9090
secret: ''
external-ui: ui
external-ui-url: https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip

# 单机场版本说明:
# 1. 保留双机场版本核心架构
# 2. 移除 Airport-B Provider
# 3. 保留 Airport-A 节点前缀体系
# 4. 不包含任何真实订阅信息
