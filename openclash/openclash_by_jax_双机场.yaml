proxy-providers:
  Airport-A:
    url: xxxxxxxx
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: A|
  Airport-B:
    url: xxxxxx
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    override:
      additional-prefix: B|
proxies:
- name: 🚀 直连
  type: direct
mixed-port: 7890
allow-lan: true
bind-address: '*'
ipv6: false
mode: rule
find-process-mode: 'off'
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true
external-controller: 0.0.0.0:9090
secret: ''
external-ui: ui
external-ui-url: https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - +.lan
  - +.local
  - dns.alidns.com
  - doh.pub
  - +.market.xiaomi.com
  - rule-set:private_domain
  - rule-set:cn_domain
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#RULES
  - https://8.8.8.8/dns-query#RULES
  prefer-h3: false
  respect-rules: true
  nameserver-policy:
    +.browserleaks.com:
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    +.browserleaks.net:
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    whoami.akamai.net:
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    whatismyip.akamai.com:
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    +.surfshark.com:
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES
    rule-set:cn_domain:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true
proxy-groups:
- name: 🛑 全局拦截
  type: select
  proxies:
  - REJECT
  - 🚀 直连
- name: 🔮 节点选择
  type: select
  proxies:
  - A|智能选择
  - B|智能选择
  - 🇭🇰 A|香港智能
  - 🇭🇰 B|香港智能
  - 🇯🇵 A|日本智能
  - 🇯🇵 B|日本智能
  - 🇹🇼 A|台湾智能
  - 🇹🇼 B|台湾智能
  - 🇺🇸 A|美国智能
  - 🇺🇸 B|美国智能
  - 🇸🇬 A|新加坡智能
  - 🇸🇬 B|新加坡智能
  - 🖐️ 手动选择
  - 🛠️ 节点测速
  - 🚀 直连
- name: 🖐️ 手动选择
  type: select
  use:
  - Airport-A
  - Airport-B
  proxies:
  - 🚀 直连
- name: 🛠️ 节点测速
  type: url-test
  use:
  - Airport-A
  - Airport-B
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: A|智能选择
  type: smart
  use:
  - Airport-A
  url: https://www.gstatic.com/generate_204
