# ============================================================
# Provider-A 地区节点测速
# ============================================================

A|香港节点 = url-test,Provider-A,use=true,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=(?i)^(?=A\|)(?=.*(?:香港|Hong Kong|(?:^|[^a-z])HK(?:[^a-z]|$)))(?!.*(?:免费|试用|0\.01|0\.1|倍率|剩余流量|流量剩余|到期|官网|通知|1\.5倍|2倍|1\.5x|2x|x1\.5|x2)).*$

A|日本节点 = url-test,Provider-A,use=true,url=http://www.gstatic.com/generate_204,interval=600,tolerance=100,timeout=5,policy-regex-filter=(?i)^(?=A\|)(?=.*(?:日本|Japan|Tokyo|东京|東京|大阪|(?:^|[^a-z])JP(?:[^a-z]|$)))(?!.*(?:免费|试用|0\.01|0\.1|倍率|剩余流量|流量剩余|到期|官网|通知|1\.5倍|2倍|1\.5x|2x|x1\.5|x2)).*$

