# ============================================================
# Clash Verge / Mihomo - JAX V3.0 Dual Airport Template
# 适用：macOS Clash Verge Rev + Mihomo
# 核心：双机场 A/B + Fake-IP + TUN mixed + 国内/国外 DNS 分流 + MRS
#
# 安全设计：
# - 本文件不保存真实机场订阅 URL
# - AirportA / AirportB 仅在 Clash Verge 本地 Merge 中注入
# - 本地 Merge 必须给两个 Provider 分别添加节点前缀 “A | ” / “B | ”
# - 公共 YAML 通过前缀完成 A/B 独立智能、地区智能和手动分组
# ============================================================

proxies:
- name: 🚀 直连
  type: direct
mode: rule
mixed-port: 7890
allow-lan: true
bind-address: '*'
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true
external-controller: 127.0.0.1:9090
secret: ''
external-ui: ui
external-ui-url: https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
sniffer:
  enable: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com
tun:
  enable: true
  stack: mixed
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: true
  auto-detect-interface: true
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - +.lan
  - +.local
  - dns.alidns.com
  - doh.pub
  - +.market.xiaomi.com
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  nameserver-policy:
    rule-set:cn_domain:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
  - https://cloudflare-dns.com/dns-query#🔮 节点选择
  - https://dns.google/dns-query#🔮 节点选择
proxy-groups:
- name: 🛑 全局拦截
  type: select
  proxies:
  - REJECT
  - 🚀 直连
