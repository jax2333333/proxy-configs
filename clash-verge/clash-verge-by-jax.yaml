# ============================================================
# Clash Verge / Mihomo - JAX V2.1 Final
# 适用：macOS Clash Verge Rev + Mihomo
# 核心：Fake-IP + TUN mixed + 国内/国外 DNS 分流 + MRS 规则
# ============================================================

# ------------------------------------------------------------
# 机场订阅
# ------------------------------------------------------------
proxy-providers:
  Airport1:
    url: "https://example.com/airport.yaml"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true

# ------------------------------------------------------------
# 本地节点
# ------------------------------------------------------------
proxies:
  - name: 🚀 直连
    type: direct

# ------------------------------------------------------------
# 全局配置
# ------------------------------------------------------------
mode: rule
mixed-port: 7890
allow-lan: true
bind-address: "*"

ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: info

keep-alive-idle: 600
keep-alive-interval: 15

profile:
  store-selected: true
  store-fake-ip: true

# Mihomo API 仅监听本机，避免局域网直接访问 9090
external-controller: 127.0.0.1:9090
secret: ""

external-ui: ui
external-ui-url: "https://gh-proxy.com/https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# ------------------------------------------------------------
# 域名嗅探
# ------------------------------------------------------------
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# ------------------------------------------------------------
# TUN
# macOS 使用 mixed；auto-redirect 仅 Linux 支持，因此不配置
# ------------------------------------------------------------
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-detect-interface: true

# ------------------------------------------------------------
# DNS
# 国内域名：阿里 / 腾讯 DoH
# 国外默认：Cloudflare / Google DoH，并通过「🔮 节点选择」连接
# 节点域名：国内 DoH，避免代理 DNS 鸡生蛋
# ------------------------------------------------------------
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "dns.alidns.com"
    - "doh.pub"
    - "+.market.xiaomi.com"

  # 用于解析 DoH 服务器域名
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 仅用于解析机场节点域名
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # DIRECT 出口域名解析
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false

  # 国内域名固定使用国内 DoH
  nameserver-policy:
    "rule-set:cn_domain":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

  # 其余域名使用境外 DoH，并强制通过代理组连接
  nameserver:
    - "https://cloudflare-dns.com/dns-query#🔮 节点选择"
    - "https://dns.google/dns-query#🔮 节点选择"

# ------------------------------------------------------------
# 出站策略
# ------------------------------------------------------------
proxy-groups:
