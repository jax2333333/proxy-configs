# 仅保存在 Clash Verge 本机；不要把真实订阅 URL 提交到 GitHub。
proxy-providers:
  AirportA:
    type: http
    url: <AIRPORT_A_SUBSCRIPTION_URL>
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
    override:
      additional-prefix: 'A | '
  AirportB:
    type: http
    url: <AIRPORT_B_SUBSCRIPTION_URL>
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      lazy: true
    override:
      additional-prefix: 'B | '